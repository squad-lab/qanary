# Run `uv sync --extra dev` then `uv run pre-commit install` once per clone.
#
# Ruff reads the same pyproject.toml settings locally and in CI.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this exact version aligned with pyproject.toml and .gitlab-ci.yml.
    rev: v0.16.6
    hooks:
      # Import sorting is handled by ruff-check, not ruff-format.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # Keep accidental measurement data out of the repository.
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        # Preserve recorded fixtures byte for byte.
        exclude: ^tests/fixtures/
      - id: trailing-whitespace
        exclude: ^tests/fixtures/
        # Preserve Markdown's two-space line breaks.
        args: [--markdown-linebreak-ext=md]
