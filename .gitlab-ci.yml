image: "python:3.13"

# Branch model: feature branches -> preview -> main. Everything is linted and
# tested on every branch, preview additionally proves the package builds, and
# only main creates a release.

stages:
  - format
  - test
  - docs
  - release

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: "true"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  # Portable git for the Windows test job. Pinned rather than "latest" so a
  # moved URL fails the download loudly instead of drifting.
  MINGIT_URL: "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/MinGit-2.55.0.5-64-bit.zip"

sast:
  stage: test

secret_detection:
  stage: test

# Fixes what ruff can fix, pushes the result back to the branch, then gates on
# whatever is left, so a merge request is never blocked on a forgotten
# `ruff format`.
#
# The commit carries [skip ci], which GitLab honours by creating no pipeline
# for that push -- without it this job would trigger itself forever. It is the
# same mechanism semantic-release already uses for its release commit.
lint:
  stage: format
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    # Keep this exact version aligned with pyproject.toml and pre-commit.
    - uv tool install ruff@0.16.6
    - git config --global user.name "Janitor"
    - git config --global user.email "squad@fz-juelich.de"
    - git remote set-url origin https://squad_janitor:$CI_FORMAT@$CI_SERVER_HOST/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME
  script:
    # Never rewrite the default branch (merge-only, protected) or a tag.
    - |
      if [ -n "$CI_COMMIT_BRANCH" ] && [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        # CI checks out a detached HEAD; put the branch here so a commit lands on it.
        git checkout -B "$CI_COMMIT_BRANCH" "$CI_COMMIT_SHA"
        # Leftovers are the gate's business below -- exiting here would discard
        # the fixes ruff has already written to disk.
        ruff check --fix . || true
        ruff format .
        if git diff --quiet; then
          echo "Nothing to fix."
        else
          git diff --stat
          # -u, not -A: never sweep up a cache directory the job created.
          git add -u
          git commit -m "style: apply ruff fixes [skip ci]"
          # Never force. If the branch moved while this ran, the rejected push
          # is the right outcome and the next pipeline fixes the new tip.
          git push origin "HEAD:$CI_COMMIT_BRANCH" ||
            echo "WARNING: fixes could not be pushed. Is $CI_COMMIT_BRANCH protected against squad_janitor?"
        fi
      fi
    # The gate. Formatting can no longer fail it on a branch, because the run
    # above has already applied it; a real lint error still can.
    - ruff check .
    - ruff format --check .

pytest:
  stage: test
  # Python 3.13 is the supported runtime for this release.
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.13"]
  image: "python:${PYTHON_VERSION}"
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
  script:
    - uv sync --python "$PYTHON_VERSION" --extra test
    - uv run --python "$PYTHON_VERSION" pytest --cov --cov-report=term --cov-report=xml --junitxml=report.xml
  coverage: '/^TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  cache:
    key: uv-$CI_JOB_NAME-$PYTHON_VERSION
    paths:
      - .uv-cache

# Windows gets a full run because Zarr stores and file locking behave
# differently there. Coverage is reported by the Linux jobs only.
pytest-windows:
  stage: test
  tags:
    - windows
  variables:
    PYTHON_VERSION: "3.13"
  before_script:
    # The python:3.13 Windows image ships no git -- the runner clones with
    # its helper image instead. The test suite needs a real one:
    # tests/test_measure.py imports GitPython at module scope and builds
    # throwaway repositories to exercise the hash-push path. MinGit is the
    # portable Git for Windows build: a zip, no installer, no admin rights.
    - $ProgressPreference = "SilentlyContinue"
    - Invoke-WebRequest -Uri "$env:MINGIT_URL" -OutFile "$env:TEMP\mingit.zip"
    - Expand-Archive -Path "$env:TEMP\mingit.zip" -DestinationPath "C:\mingit" -Force
    - $env:Path = "C:\mingit\cmd;$env:Path"
    - git --version
    - powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
    - $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
  script:
    - uv sync --python $env:PYTHON_VERSION --extra test
    - uv run --python $env:PYTHON_VERSION pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
  cache:
    key: uv-$CI_JOB_NAME-$PYTHON_VERSION
    paths:
      - .uv-cache

deploy-pages:
  stage: docs
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
  script:
    - uv sync --group docs
    - uv run sphinx-build -M html docs/source docs/public
  pages:
    publish: docs/public/html
  cache:
    key: uv-$CI_JOB_NAME
    paths:
      - .uv-cache
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

semantic_release:
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    # semantic-release needs all commits and tags to calculate the next version.
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    - git config --global user.name "Janitor"
    - git config --global user.email "squad@fz-juelich.de"
    - git remote set-url origin https://squad_janitor:$CI_FORMAT@$CI_SERVER_HOST/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME
    # GitLab checks out a detached HEAD, while semantic-release needs a branch.
    - git fetch origin $CI_COMMIT_BRANCH
    - git checkout $CI_COMMIT_BRANCH
    - git reset --hard origin/$CI_COMMIT_BRANCH
    - uv tool install python-semantic-release
  script:
    - |
      RELEASE_TAG="$(semantic-release version --print-tag)"
      LAST_TAG="$(semantic-release version --print-last-released-tag)"
      if [ "$RELEASE_TAG" = "$LAST_TAG" ]; then
        echo "No release-worthy commits; no version will be published."
        echo "RELEASE_CREATED=false" > release.env
        exit 0
      fi
      echo "RELEASE_CREATED=true" > release.env
      echo "RELEASE_TAG=$RELEASE_TAG" >> release.env
      semantic-release version --push --changelog --no-vcs-release
  artifacts:
    paths:
      - dist/
      - CHANGELOG.md
      - release.env
    expire_in: never
    reports:
      dotenv: release.env

gitlab_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: semantic_release
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - |
      if [ "$RELEASE_CREATED" != "true" ]; then
        echo "semantic-release did not cut a version; no GitLab Release needed."
        exit 0
      fi
      unset GITLAB_TOKEN GITLAB_ACCESS_TOKEN OAUTH_TOKEN
      glab release create "$RELEASE_TAG" \
        --name "Release $RELEASE_TAG" \
        --notes-file CHANGELOG.md \
        --ref "$RELEASE_TAG"

pypi:
  stage: release
  needs:
    - job: semantic_release
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $PYPI_SPANDAN
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
  script:
    - |
      if ! ls dist/*.whl >/dev/null 2>&1; then
        echo "semantic-release produced no distribution -- nothing to publish."
        exit 0
      fi
    - uv publish --token "$PYPI_SPANDAN"

build_package:
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == "preview"
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
  script:
    - uv build
  artifacts:
    paths:
      - dist/*.tar.gz
      - dist/*.whl
