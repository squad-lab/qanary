[project]
name = "qcutils"
version = "0.8.0"
authors = [
  { name="Spandan Anupam", email="s.anupam@fz-juelich.de" },
  { name="Simon Schreibing", email="s.schreibing@fz-juelich.de" },
  { name="Jyotirmaya Shivottam", email="j.shivottam@fz-juelich.de" },
]
description = "Sweep and measurement utilities for qcodes"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
keywords = ["qcodes"]
dependencies = [
  "checksumdir>=1.2.0",
  "gitpython>=3.1.44",
  "qcodes>=0.45", # ==0.45 if plottr inspectr should be run in the same env
  "scipy>=1.15.2",
  "ipykernel>=7.1.0",
  "setuptools>=78.1.0",
  "zarr==2.18.4",
  "numcodecs==0.15.0",
  "zhinst>=25.1.0",
  "zhinst-qcodes>=0.6.0",
  "pillow>=11.2.1",
  "qcodes-contrib-drivers>=0.23.0",
  "pyvisa>=1.14.1",
  "pyvisa-py>=0.7.2",
  "zeroconf>=0.147.2",
  "qimchi-connect>=0.1.0",
  # TODO: publish `drivers` to PyPI, then publish QCUtils there too.
  # `drivers` resolves from GitLab through [tool.uv.sources] below, which is a
  # uv-local override: it is NOT written into the built wheel metadata, so a
  # downstream `pip install qcutils` would resolve the unrelated PyPI package
  # of the same name. PyPI rejects direct-URL requirements, so the git URL
  # cannot be encoded here either. Until `drivers` is on PyPI, QCUtils is
  # installed from git and the `pypi` CI job stays commented out.
  "drivers",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
dev = [
  "pre-commit>=4",
  # Keep this exact version aligned with pre-commit and GitLab CI.
  "ruff==0.16.6",
  "pytest>=8",
  "pytest-cov>=5",
]

[project.urls]
"Homepage" = "https://gitlab.com/squad-lab/qcutils"
"Bug Tracker" = "https://gitlab.com/squad-lab/qcutils/-/issues"

[dependency-groups]
dev = [
    "qcutils",
]
docs = [
    "sphinx>=8.2",
    # [linkify] pulls linkify-it-py, required by the `linkify` MyST extension
    # enabled in conf.py. Without it every docs build fails at import.
    "myst-parser[linkify]>=4",
    "furo>=2024.8",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
]

[tool.uv]
package = true

[tool.uv.sources]
qcutils = { workspace = true }
drivers = { git = "https://gitlab.com/squad-lab/measurements/drivers.git" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true
packages = [
    { include = "qcutils", from = "src" },
]

[tool.semantic_release]
# NOTE: Commit-based versioning. CI owns the version literal below; do not bump it by
# hand, or semantic-release and the tag history will disagree.
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): v{version}\n\n[skip ci]"
commit_author = "Janitor <squad@fz-juelich.de>"
build_command = "uv build"
tag_format = "v{version}"
# Without `major_on_zero`, the first `feat:` commit after 0.8.0 releases 1.0.0.
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

# preview is the release train: it is built and tested, never released. Cutting
# release candidates from it later only needs prerelease = true here.
[tool.semantic_release.branches.preview]
match = "preview"
prerelease = true
prerelease_token = "rc"

# Without this, python-semantic-release assumes GitHub and every commit link it
# writes into CHANGELOG.md points at github.com/squad-lab/qcutils -- a 404.
[tool.semantic_release.remote]
type = "gitlab"
domain = "gitlab.com"

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore\\(release\\):", "^ruff update$"]

[tool.ruff]
target-version = "py313"
# Ruff 0.16 formats Python code blocks inside Markdown, but the ruff-format
# pre-commit hook only passes it Python files. Excluding Markdown keeps a local
# `ruff format .`, the hooks and CI in agreement, rather than having CI fail on
# md files.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E/F are ruff's defaults; I adds import sorting.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["qcutils"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/qcutils"]
branch = true

[tool.coverage.report]
show_missing = true
# Hardware drivers and interactive plumbing cannot run on a CI runner.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
