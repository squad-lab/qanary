[project]
name = "qcutils"
version = "0.8.0"
authors = [
  { name="Spandan Anupam", email="s.anupam@fz-juelich.de" },
]
description = "Sweep and measurement utilities for qcodes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]
keywords = ["qcodes"]
dependencies = [
  "checksumdir>=1.2.0",
  "gitpython>=3.1.44",
  "qcodes>=0.45", # ==0.45 if plottr inspectr should be run in the same env
  "scipy>=1.15.2",
  "ipykernel>=7.1.0",
  "setuptools>=78.1.0",
  "zarr==2.18.4",
  "numcodecs==0.15.0",
  "zhinst>=25.1.0",
  "zhinst-qcodes>=0.6.0",
  "pillow>=11.2.1",
  "qcodes-contrib-drivers>=0.23.0",
  "tool>=0.8.0",
  "ruff>=0.11.6",
  "pyvisa>=1.14.1",
  "pyvisa-py>=0.7.2",
  "zeroconf>=0.147.2",
  "websockets>=16.0",
  "drivers",
]

[project.urls]
"Homepage" = "https://gitlab.com/squad-lab/qcutils"
"Bug Tracker" = "https://gitlab.com/squad-lab/qcutils/-/issues"

[dependency-groups]
dev = [
    "qcutils",
]

[tool.uv] 
package = true

[tool.uv.sources]
qcutils = { workspace = true }
drivers = { git = "https://gitlab.com/squad-lab/measurements/drivers.git" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true
packages = [
    { include = "qcutils", from = "src" },
]
