[project]
name = "qanary"
version = "0.12.3"
authors = [
  { name="Spandan Anupam", email="s.anupam@fz-juelich.de" },
  { name="Simon Schreibing", email="s.schreibing@fz-juelich.de" },
  { name="Jyotirmaya Shivottam", email="shivottam@proton.me" },
  { name="Vincent Mourik", email="v.mourik@fz-juelich.de" },
]
description = "Sweep and measurement utilities for qcodes"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["qanary", "qcodes", "quantum", "measurement", "sweep", "xarray"]
dependencies = [
  "checksumdir>=1.2.0",
  "gitpython>=3.1.44",
  "numpy>=2.2",
  "qcodes>=0.59.0",
  "qimchi-connect>=0.2.0",
  "tqdm>=4.66",
  "xarray>=2025.1",
  "zarr>=3.1,<4",
]

[project.optional-dependencies]
drivers = [
  "qcdrivers>=0.6.1",
  "qcodes-contrib-drivers>=0.23.0",
]
# The tests check that the examples' driver imports still resolve.
test = [
  "qanary[drivers]",
  "pytest>=8",
  "pytest-cov>=5",
]
dev = [
  "qanary[drivers]",
  "pre-commit>=4",
  # Keep this exact version aligned with pre-commit and GitLab CI.
  "ruff==0.16.6",
  "pytest>=8",
  "pytest-cov>=5",
]

[project.urls]
"Homepage" = "https://qanary.squad-lab.org/"
"Documentation" = "https://qanary.squad-lab.org/"
"Repository" = "https://gitlab.com/squad-lab/qanary"
"Bug Tracker" = "https://gitlab.com/squad-lab/qanary/-/issues"
"SQUAD Lab" = "https://squad-lab.org/"

[dependency-groups]
dev = [
    "qanary",
]
docs = [
    "sphinx>=8.2",
    # The MyST linkify extension requires linkify-it-py.
    "myst-parser[linkify]>=4",
    "furo>=2024.8",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "sphinx-sitemap>=2.6",
    "sphinxext-opengraph>=0.10",
]

[tool.uv]
package = true

[tool.uv.sources]
qanary = { workspace = true }

# Hatchling preserves every author in the published metadata.
[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qanary"]

[tool.semantic_release]
# CI updates the version from conventional commits; do not bump it by hand.
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): v{version}\n\n[skip ci]"
commit_author = "Janitor <squad@fz-juelich.de>"
# Update CITATION.cff and the README citation; include both in the release commit.
build_command = "bash scripts/sync_release_metadata.sh && uv build"
assets = ["CITATION.cff", "README.md"]
tag_format = "v{version}"
# Before 1.0, breaking changes increment the minor version.
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

# Preview is built and tested but never published.
[tool.semantic_release.branches.preview]
match = "preview"
prerelease = true
prerelease_token = "rc"

# Tell semantic-release to generate GitLab links in the changelog.
[tool.semantic_release.remote]
type = "gitlab"
domain = "gitlab.com"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^chore\\(release\\):",
    "^ruff update$",
    # The CI lint job commits its own formatting fixes.
    "^style: apply ruff fixes",
]

[tool.ruff]
target-version = "py313"
# Pre-commit only passes Python files to ruff-format, so exclude Markdown from
# repository-wide Ruff runs as well.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E/F are ruff's defaults; I adds import sorting.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["qanary"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/qanary"]
branch = true

[tool.coverage.report]
show_missing = true
# Hardware drivers and interactive plumbing cannot run on a CI runner.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
